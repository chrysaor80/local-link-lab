name: Spec consistency

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-spec.txt
      - run: python scripts/check_spec.py
