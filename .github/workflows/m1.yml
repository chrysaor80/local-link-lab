name: Android and fault verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    uses: ./.github/workflows/spec.yml
  pos:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest pos.test_pos pos.test_m1_redteam lab.test_verdict lab.test_variants lab.test_m2_redteam lab.test_candidate lab.test_m3_recheck lab.test_build_identity -v
      - name: Candidate gate also survives Python optimization
        run: python -O -m unittest lab.test_candidate lab.test_m3_recheck lab.test_build_identity -v
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start isolated POS for JVM controller regressions
        run: |
          mkdir -p artifacts
          python -u -m pos.server --db artifacts/robo-pos.db --port 18765 > artifacts/robo-pos.log 2>&1 &
      - name: JVM verification and APK compilation
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest --stacktrace
      - name: Release excludes lab control
        run: python -m lab.check_variants
      - name: Build and stamp the clean source before emulator verification
        run: python -m lab.package_candidate stamp
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start fresh host POS
        run: |
          mkdir -p artifacts
          python -u -m pos.server --db artifacts/m1-pos.db --host 127.0.0.1 --port 8765 > artifacts/pos.log 2>&1 &
          python -u -m pos.server --db artifacts/recovery-pos.db --port 18766 > artifacts/recovery-pos.log 2>&1 &
      - name: Android UI, Room and TCP verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.locallinklab.app.RepositoryTest,dev.locallinklab.app.RoundTripTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
            adb exec-out run-as dev.locallinklab.app cat files/m1-baseline.json > artifacts/m1-baseline.json
            adb exec-out run-as dev.locallinklab.app cat files/m1-result.json > artifacts/m1-result.json
            adb logcat -d > artifacts/logcat.txt
            python scripts/verify_m1.py
            cp -r app/build/outputs/androidTest-results artifacts/m1-android-tests
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=dev.locallinklab.app.ControllerRecoveryTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true --stacktrace
            python -m lab.android_run --out artifacts/m2-normal
            adb exec-out screencap -p > artifacts/emulator-result.png
            python -m lab.mutations --normal-summary artifacts/m2-normal/summary.json --out artifacts/m2-mutations
            adb logcat -d > artifacts/m2-logcat.txt
      - name: Preserve test evidence and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-fault-evidence
          if-no-files-found: error
          path: |
            artifacts/
            core/build/test-results/
            app/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/

  candidate:
    name: Verified demo candidate
    needs: [spec, pos, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: android-fault-evidence
          path: verified
      - name: Check evidence and promote the tested APK
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python -m lab.package_candidate package --evidence verified --out artifacts/demo-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: local-link-lab-demo-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/demo-candidate/
