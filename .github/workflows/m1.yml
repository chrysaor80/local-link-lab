name: M1 implementation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pos:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest pos.test_pos -v
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: JVM verification and APK compilation
        run: ./gradlew :core:test :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start fresh host POS
        run: |
          mkdir -p artifacts
          python -u -m pos.server --db artifacts/m1-pos.db --host 127.0.0.1 --port 8765 > artifacts/pos.log 2>&1 &
      - name: Android UI, Room and TCP verification
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --stacktrace
            adb exec-out run-as dev.locallinklab.app cat files/m1-baseline.json > artifacts/m1-baseline.json
            adb exec-out run-as dev.locallinklab.app cat files/m1-result.json > artifacts/m1-result.json
            adb logcat -d > artifacts/logcat.txt
            python scripts/verify_m1.py
      - name: Preserve test evidence and debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-android-evidence
          if-no-files-found: error
          path: |
            artifacts/
            core/build/test-results/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/
